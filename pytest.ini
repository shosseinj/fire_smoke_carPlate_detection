[pytest]
pythonpath = .
testpaths = tests
markers =
    api: API-level integration tests
    crud: Comprehensive CRUD API tests
    postgresql: Tests requiring TEST_DATABASE_URL
    smoke: Smoke tests for module validation
    store: Store-level unit tests
    unit: Fast unit/contract tests with no external dependencies (no DB, no camera, no runtime)
    streaming: Tests that build the runtime, processors, cameras, or open video streams (slow)
