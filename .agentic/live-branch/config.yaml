feature:
  name: decode-tee-live-branch
  enabled_by_default: false

routes:
  dashboard: /dashboard
  live_wall: /dashboard/live-branch
  api_prefix: /api/v1/live-branch
  stream_namespace: live-branch

wall:
  width: 320
  height: 320
  preserve_source_fps: true
  overlay_fps: true
  overlay_resolution: true

fullscreen:
  resolution: native
  preserve_source_fps: true
  overlay_fps: true
  overlay_resolution: true
  startup_latency_target_ms: 3000

lifecycle:
  heartbeat_interval_seconds: 5
  heartbeat_timeout_seconds: 15
  shutdown_grace_seconds: 5

media:
  gpu_memory_required: NVMM
  preferred_codec: h264
  browser_protocol: whep
  mediamtx_browser_port: 8789

validation:
  require_playwright: true
  require_current_time_advance: true
  current_time_observation_seconds: 3
  require_runtime_gpu_evidence: true
  require_ai_isolation_review: true
