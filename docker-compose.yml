services:
  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: video_ai_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d video_ai_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  qdrant:
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  mediamtx:
    image: bluenviron/mediamtx:1.13.1
    restart: unless-stopped
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8789:8889"
      - "8189:8189/udp"

  video-ai-router:
    image: merged-video-ai-router:v10-flat
    build:
      context: .
      dockerfile: Dockerfile.deepstream
      args:
        INSTALL_AI_REQUIREMENTS: ${INSTALL_AI_REQUIREMENTS:-0}
    working_dir: /workspace
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        alembic upgrade head &&
        exec python3 -m uvicorn app.main:app
        --host 0.0.0.0
        --port 9999
    env_file: ./app/.env
    environment:
      PROCESSOR_MODE: ${PROCESSOR_MODE:-real}
      VIDEO_ONLY_MODE: ${VIDEO_ONLY_MODE:-true}
      PYTHONFAULTHANDLER: "1"
      VIDEO_INGEST_BACKEND: deepstream
      VIDEO_INGESTION_ENABLED: "true"
      STATIC_VIDEO_INGESTION_ENABLED: ${STATIC_VIDEO_INGESTION_ENABLED:-true}
      STATIC_VIDEO_STARTUP_DELAY_SECONDS: ${STATIC_VIDEO_STARTUP_DELAY_SECONDS:-0}
      TASK_QUEUE_POLICY: ${TASK_QUEUE_POLICY:-latest_per_source}
      TASK_QUEUE_CAPACITY: ${TASK_QUEUE_CAPACITY:-512}
      TASK_QUEUE_BLOCK_TIMEOUT_MS: ${TASK_QUEUE_BLOCK_TIMEOUT_MS:-500}
      WORKER_THREADS: ${WORKER_THREADS:-1}
      RTSP_SOURCE_COUNT: ${RTSP_SOURCE_COUNT:-512}
      STATIC_VIDEO_SOURCE_COUNT: ${STATIC_VIDEO_SOURCE_COUNT:-256}
      DEEPSTREAM_MAX_ACTIVE_SOURCES: ${DEEPSTREAM_MAX_ACTIVE_SOURCES:-32}
      DEEPSTREAM_SOURCE_OPEN_STAGGER_SECONDS: ${DEEPSTREAM_SOURCE_OPEN_STAGGER_SECONDS:-5}
      DEEPSTREAM_SOURCE_ALLOWLIST: "${DEEPSTREAM_SOURCE_ALLOWLIST:-}"
      VIDEO_STREAM_DEMAND_GRACE_SECONDS: ${VIDEO_STREAM_DEMAND_GRACE_SECONDS:-2}
      BROADCAST_WALL_JPEG_QUALITY: ${BROADCAST_WALL_JPEG_QUALITY:-60}
      BROADCAST_WALL_MAX_WIDTH: ${BROADCAST_WALL_MAX_WIDTH:-320}
      BROADCAST_WALL_MAX_HEIGHT: ${BROADCAST_WALL_MAX_HEIGHT:-320}
      BROADCAST_SOURCE_ONLY_RENDER_THREADS: ${BROADCAST_SOURCE_ONLY_RENDER_THREADS:-4}
      BROADCAST_RENDER_THREADS: ${BROADCAST_RENDER_THREADS:-4}
      BROADCAST_JPEG_QUALITY: ${BROADCAST_JPEG_QUALITY:-75}
      BROADCAST_FACE_OVERLAY_TTL_MS: ${BROADCAST_FACE_OVERLAY_TTL_MS:-750}
      MEDIA_PREVIEW_ENABLED: ${MEDIA_PREVIEW_ENABLED:-true}
      MEDIA_PREVIEW_PUBLISH_BASE: ${MEDIA_PREVIEW_PUBLISH_BASE:-rtsp://mediamtx:8554}
      MEDIA_PREVIEW_WHEP_BASE_URL: "${MEDIA_PREVIEW_WHEP_BASE_URL:-}"
      VIDEO_LOOP: ${VIDEO_LOOP:-true}
      RTSP_INGESTION_ENABLED: ${RTSP_INGESTION_ENABLED:-true}
      RTSP_TRANSPORT: ${RTSP_TRANSPORT:-tcp}
      RTSP_RECONNECT_SECONDS: ${RTSP_RECONNECT_SECONDS:-3}
      DEEPSTREAM_RTSP_LATENCY_MS: ${DEEPSTREAM_RTSP_LATENCY_MS:-500}
      DEEPSTREAM_RTSP_STALL_TIMEOUT_SECONDS: ${DEEPSTREAM_RTSP_STALL_TIMEOUT_SECONDS:-30}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      CAMERA_DB_PATH: /workspace/data/cameras.sqlite3
      SOURCE_REGISTRY_PATH: /workspace/data/sources.json
      PLATE_LOG_DB_PATH: /workspace/data/plate_logs.sqlite3
      SAVED_MEDIA_PATH: /workspace/saved_media
      MODEL_ROOT_PATH: /workspace/weights
      MODEL_PREFERRED_FORMAT: ${MODEL_PREFERRED_FORMAT:-engine}
      MODEL_ALLOW_ONNX_FALLBACK: ${MODEL_ALLOW_ONNX_FALLBACK:-true}
      MODEL_ALLOW_PT_FALLBACK: ${MODEL_ALLOW_PT_FALLBACK:-true}
      MODEL_EXPORT_IMGSZ: ${MODEL_EXPORT_IMGSZ:-640}
      MODEL_EXPORT_BATCH_SIZE: ${MODEL_EXPORT_BATCH_SIZE:-16}
      MODEL_EXPORT_WORKSPACE_GB: ${MODEL_EXPORT_WORKSPACE_GB:-4}
      MODEL_EXPORT_HALF: ${MODEL_EXPORT_HALF:-true}
      MODEL_EXPORT_DYNAMIC: ${MODEL_EXPORT_DYNAMIC:-true}
      MODEL_EXPORT_TIMEOUT_SECONDS: ${MODEL_EXPORT_TIMEOUT_SECONDS:-300}
      FIRE_CONFIDENCE: ${FIRE_CONFIDENCE:-0.30}
      SMOKE_CONFIDENCE: ${SMOKE_CONFIDENCE:-0.30}
      FIRE_LOW_SEVERITY_CONFIDENCE: ${FIRE_LOW_SEVERITY_CONFIDENCE:-0.45}
      FIRE_MEDIUM_SEVERITY_CONFIDENCE: ${FIRE_MEDIUM_SEVERITY_CONFIDENCE:-0.50}
      FIRE_HIGH_SEVERITY_CONFIDENCE: ${FIRE_HIGH_SEVERITY_CONFIDENCE:-0.60}
      SMOKE_LOW_SEVERITY_CONFIDENCE: ${SMOKE_LOW_SEVERITY_CONFIDENCE:-0.40}
      SMOKE_MEDIUM_SEVERITY_CONFIDENCE: ${SMOKE_MEDIUM_SEVERITY_CONFIDENCE:-0.45}
      SMOKE_HIGH_SEVERITY_CONFIDENCE: ${SMOKE_HIGH_SEVERITY_CONFIDENCE:-0.55}
      FIRE_SMOKE_MODEL_PATH: ${FIRE_SMOKE_MODEL_PATH:-/workspace/weights/fire_smoke/linux_trt10/best_nano_111_dynamic_b26_trt107.engine}
      FIRE_SMOKE_ENGINE_FIXED_BATCH: ${FIRE_SMOKE_ENGINE_FIXED_BATCH:-0}
      PLATE_CONFIDENCE: ${PLATE_CONFIDENCE:-0.30}
      PLATE_DETECTOR_WEIGHTS: ${PLATE_DETECTOR_WEIGHTS:-/workspace/weights/plate_detector/model_dynamic_b26_trt107.engine}
      PLATE_CLASS_IDS: ${PLATE_CLASS_IDS:-0}
      PLATE_LOG_QUEUE_SIZE: ${PLATE_LOG_QUEUE_SIZE:-128}
      PLATE_RECOGNIZER_DIR: ${PLATE_RECOGNIZER_DIR:-/workspace/weights/plate_recognizer}
      PLATE_CROP_BATCH_SIZE: ${PLATE_CROP_BATCH_SIZE:-26}
      VEHICLE_CONFIDENCE: ${VEHICLE_CONFIDENCE:-0.35}
      VEHICLE_DETECTOR_WEIGHTS: ${VEHICLE_DETECTOR_WEIGHTS:-/workspace/weights/vehicle_detector/yolo11n_dynamic_b26_trt107.engine}
      VEHICLE_IOU: ${VEHICLE_IOU:-0.45}
      VEHICLE_IMGSZ: ${VEHICLE_IMGSZ:-640}
      VEHICLE_MAX_PER_FRAME: ${VEHICLE_MAX_PER_FRAME:-12}
      VEHICLE_CLASS_IDS: ${VEHICLE_CLASS_IDS:-2,3,5,7}
      VEHICLE_CROP_PADDING_RATIO: ${VEHICLE_CROP_PADDING_RATIO:-0.05}
      PLATE_OCR_CONFIDENCE: ${PLATE_OCR_CONFIDENCE:-0.50}
      MIN_VEHICLE_WIDTH_PIXELS: ${MIN_VEHICLE_WIDTH_PIXELS:-120}
      MIN_VEHICLE_HEIGHT_PIXELS: ${MIN_VEHICLE_HEIGHT_PIXELS:-80}
      MIN_VEHICLE_AREA_RATIO: ${MIN_VEHICLE_AREA_RATIO:-0.025}
      FACE_HUMAN_MODEL: ${FACE_HUMAN_MODEL:-/workspace/weights/face_recognition/linux_trt10/yolo26s-pose_dynamic_b26_trt107.engine}
      FACE_DETECTOR_MODEL: ${FACE_DETECTOR_MODEL:-/workspace/weights/face_recognition/linux_trt10/yolov8n-face_dynamic_b26_trt107.engine}
      FACE_EMBEDDING_MODEL: ${FACE_EMBEDDING_MODEL:-/workspace/weights/face_recognition/linux_trt10/arcface_dynamic_b64_trt107.engine}
      FACE_DEVICE: ${FACE_DEVICE:-0}
      FACE_BATCH_SIZE: ${FACE_BATCH_SIZE:-26}
      FACE_MAX_WAIT_MS: ${FACE_MAX_WAIT_MS:-60}
      FIRE_BATCH_SIZE: ${FIRE_BATCH_SIZE:-26}
      FIRE_MAX_WAIT_MS: ${FIRE_MAX_WAIT_MS:-60}
      PLATE_BATCH_SIZE: ${PLATE_BATCH_SIZE:-26}
      PLATE_MAX_WAIT_MS: ${PLATE_MAX_WAIT_MS:-60}
      FACE_HUMAN_ENGINE_FIXED_BATCH: ${FACE_HUMAN_ENGINE_FIXED_BATCH:-0}
      FACE_DETECTOR_ENGINE_FIXED_BATCH: ${FACE_DETECTOR_ENGINE_FIXED_BATCH:-0}
      FACE_RECOGNITION_THRESHOLD: ${FACE_RECOGNITION_THRESHOLD:-0.45}
      FACE_QUALITY_THRESHOLD: ${FACE_QUALITY_THRESHOLD:-0.55}
      FACE_MIN_WIDTH: ${FACE_MIN_WIDTH:-24}
      FACE_MIN_HEIGHT: ${FACE_MIN_HEIGHT:-24}
      FACE_MAX_ABS_YAW: ${FACE_MAX_ABS_YAW:-45}
      FACE_MAX_ABS_PITCH: ${FACE_MAX_ABS_PITCH:-55}
      FACE_MAX_ABS_ROLL: ${FACE_MAX_ABS_ROLL:-35}
      FACE_REQUIRE_LANDMARKS: ${FACE_REQUIRE_LANDMARKS:-true}
      FACE_TRACKER_HIGH_THRESHOLD: ${FACE_TRACKER_HIGH_THRESHOLD:-0.40}
      FACE_TRACKER_LOW_THRESHOLD: ${FACE_TRACKER_LOW_THRESHOLD:-0.10}
      FACE_TRACKER_NEW_THRESHOLD: ${FACE_TRACKER_NEW_THRESHOLD:-0.40}
      FACE_TRACKER_MATCH_THRESHOLD: ${FACE_TRACKER_MATCH_THRESHOLD:-0.80}
      FACE_TRACKER_MAX_MISSED: ${FACE_TRACKER_MAX_MISSED:-30}
      FACE_HISTORY_SIZE: ${FACE_HISTORY_SIZE:-30}
      FACE_STABLE_MIN_HITS: ${FACE_STABLE_MIN_HITS:-3}
      FACE_EMBEDDING_BATCH_SIZE: ${FACE_EMBEDDING_BATCH_SIZE:-64}
      FACE_QDRANT_COLLECTION: ${FACE_QDRANT_COLLECTION:-faces}
      FACE_QDRANT_URL: ${FACE_QDRANT_URL:-http://qdrant:6333}
      FACE_QDRANT_API_KEY: ${FACE_QDRANT_API_KEY:-}
      HUMAN_MEDIA_QUEUE_SIZE: ${HUMAN_MEDIA_QUEUE_SIZE:-256}
      HUMAN_VIDEO_FPS: ${HUMAN_VIDEO_FPS:-5}
      HUMAN_VIDEO_IDLE_SECONDS: ${HUMAN_VIDEO_IDLE_SECONDS:-5}
      HUMAN_SNAPSHOT_MIN_IMPROVEMENT: ${HUMAN_SNAPSHOT_MIN_IMPROVEMENT:-0.01}
    ports:
      - "9999:9999"
    volumes:
      - .:/workspace
    shm_size: "2gb"
    depends_on:
      qdrant:
        condition: service_healthy
      mediamtx:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  video-ai-router-shell:
    image: merged-video-ai-router:v10-flat
    profiles: ["shell"]
    entrypoint: /bin/bash
    working_dir: /workspace
    stdin_open: true
    tty: true
    env_file: ./app/.env
    environment:
      PROCESSOR_MODE: real
      VIDEO_INGEST_BACKEND: deepstream
      VIDEO_INGESTION_ENABLED: "true"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      FACE_QDRANT_URL: http://qdrant:6333
    ports:
      - "9999:9999"
    volumes:
      - .:/workspace
    shm_size: "2gb"
    depends_on:
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
