[alembic]
script_location = alembic
prepend_sys_path = .
timezone = UTC

# env.py replaces this value with DATABASE_URL/app.config at runtime.
sqlalchemy.url = postgresql+psycopg2://postgres:Asd1234@host.docker.internal:5432/ai_database

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
