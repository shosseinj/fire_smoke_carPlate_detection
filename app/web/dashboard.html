<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video AI Operations Wall</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070a11;
        --panel: #101621;
        --panel-2: #151d2b;
        --line: #263246;
        --text: #f5f7fb;
        --muted: #91a0b7;
        --cyan: #27d3ff;
        --green: #38dc86;
        --orange: #ffad42;
        --red: #ff5263;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 15% -10%, rgba(39, 211, 255, 0.12), transparent 32rem), radial-gradient(circle at 95% 0%, rgba(56, 220, 134, 0.08), transparent 28rem), var(--bg);
        color: var(--text);
        font:
          14px/1.45 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 18px 24px;
        border-bottom: 1px solid rgba(145, 160, 183, 0.18);
        background: rgba(7, 10, 17, 0.88);
        backdrop-filter: blur(18px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand-mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid rgba(39, 211, 255, 0.45);
        border-radius: 12px;
        background: rgba(39, 211, 255, 0.1);
        color: var(--cyan);
        font-weight: 900;
        letter-spacing: -0.05em;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.01em;
      }
      .subtitle {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .docs-link {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 12px;
        color: #b9c7db;
        text-decoration: none;
        font-size: 12px;
        font-weight: 750;
        transition: 0.18s ease;
      }
      .docs-link:hover {
        border-color: var(--cyan);
        color: var(--text);
      }
      .state {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .state-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 0 4px rgba(255, 82, 99, 0.12);
      }
      .state.live .state-dot {
        background: var(--green);
        box-shadow:
          0 0 0 4px rgba(56, 220, 134, 0.12),
          0 0 16px rgba(56, 220, 134, 0.55);
      }
      button {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 14px;
        background: var(--panel-2);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-weight: 750;
        transition: 0.18s ease;
      }
      button:hover {
        border-color: var(--cyan);
        transform: translateY(-1px);
      }
      button.stop {
        border-color: rgba(255, 82, 99, 0.4);
        color: #ff9aa5;
      }
      button:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 2px;
      }
      main {
        padding: 22px 24px 36px;
      }
      .summary {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 16px;
        color: var(--muted);
        font-size: 12px;
      }
      .camera-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }
      .camera-card {
        overflow: hidden;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: linear-gradient(145deg, rgba(21, 29, 43, 0.96), rgba(11, 15, 24, 0.98));
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
      }
      .stream-shell {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: #03050a;
      }
      .stream-toolbar {
        position: absolute;
        inset: 10px 10px auto 10px;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        pointer-events: none;
      }
      .stream-profile {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .fps-badge {
        border: 1px solid rgba(56, 220, 134, 0.35);
        border-radius: 999px;
        padding: 5px 9px;
        background: rgba(3, 8, 13, 0.8);
        color: #83f4b5;
        font:
          800 11px/1 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(8px);
      }
      .resolution-badge {
        border: 1px solid rgba(39, 211, 255, 0.32);
        border-radius: 999px;
        padding: 5px 9px;
        background: rgba(3, 8, 13, 0.8);
        color: #8eeaff;
        font:
          800 11px/1 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        backdrop-filter: blur(8px);
      }
      .camera-fullscreen {
        padding: 6px 9px;
        border-color: rgba(145, 160, 183, 0.35);
        border-radius: 8px;
        background: rgba(3, 8, 13, 0.8);
        font-size: 11px;
        pointer-events: auto;
        backdrop-filter: blur(8px);
      }
      .stream-shell video,
      .stream-shell canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .stream-shell canvas {
        pointer-events: none;
      }
      .jpeg-fallback {
        position: absolute;
        inset: 0;
        display: none;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #03050a;
      }
      .stream-status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        background: repeating-linear-gradient(-45deg, #0a0e16, #0a0e16 8px, #0d121c 8px, #0d121c 16px);
        color: var(--muted);
        text-align: center;
        font-size: 12px;
        letter-spacing: 0.04em;
        pointer-events: none;
      }
      .stream-status.hidden {
        display: none;
      }
      .card-info {
        padding: 12px 13px 13px;
      }
      .camera-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .camera-name {
        overflow: hidden;
        font-weight: 800;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .camera-id {
        color: var(--muted);
        font:
          11px ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
      }
      .frame-metrics {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 9px;
        color: var(--muted);
        font:
          11px ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
      }
      .task-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .task-chip {
        border: 1px solid rgba(39, 211, 255, 0.28);
        border-radius: 999px;
        padding: 4px 8px;
        background: rgba(39, 211, 255, 0.08);
        color: #8eeaff;
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .task-chip.fire {
        border-color: rgba(255, 173, 66, 0.35);
        background: rgba(255, 173, 66, 0.09);
        color: #ffc779;
      }
      .offline {
        opacity: 0.55;
      }
      .camera-card:fullscreen {
        display: flex;
        width: 100vw;
        height: 100vh;
        flex-direction: column;
        border: 0;
        border-radius: 0;
        background: #000;
      }
      .camera-card:fullscreen .stream-shell {
        flex: 1;
        aspect-ratio: auto;
      }
      .camera-card:fullscreen .card-info {
        background: #090d15;
      }
      .dashboard-layout {
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }
      .dashboard-layout .camera-grid {
        flex: 1;
        min-width: 0;
      }
      .recent-panel {
        width: 340px;
        flex-shrink: 0;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: linear-gradient(145deg, rgba(21, 29, 43, 0.96), rgba(11, 15, 24, 0.98));
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
        max-height: calc(100vh - 140px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .recent-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--line);
      }
      .recent-header h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .recent-header .count {
        border-radius: 999px;
        padding: 2px 8px;
        background: var(--panel-2);
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
      }
      .recent-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }
      .recent-item {
        display: flex;
        gap: 10px;
        padding: 8px;
        border-radius: 10px;
        transition: background 0.15s;
        cursor: default;
      }
      .recent-item:hover {
        background: rgba(39, 211, 255, 0.05);
      }
      .recent-item + .recent-item {
        margin-top: 4px;
      }
      .recent-item.new {
        animation: recentFadeIn 0.35s ease;
      }
      @keyframes recentFadeIn {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .recent-face {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        object-fit: cover;
        flex-shrink: 0;
        background: var(--panel-2);
      }

      .recent-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .recent-info .name {
        font-weight: 700;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .recent-info .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        font-size: 11px;
        color: var(--muted);
      }
      .recent-info .meta span {
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .recent-info .meta .granted {
        color: var(--green);
      }
      .recent-info .meta .denied {
        color: var(--red);
      }
      .recent-info .classification {
        display: inline-block;
        border-radius: 999px;
        padding: 1px 6px;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
      }
      .classification.known {
        background: rgba(56, 220, 134, 0.15);
        color: var(--green);
      }
      .classification.unsure {
        background: rgba(255, 173, 66, 0.15);
        color: var(--orange);
      }
      .classification.unknown {
        background: rgba(255, 82, 99, 0.15);
        color: var(--red);
      }
      .recent-empty {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        padding: 32px 16px;
      }
      @media (max-width: 1250px) {
        .camera-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .dashboard-layout {
          flex-direction: column;
        }
        .recent-panel {
          width: 100%;
          max-height: 320px;
        }
      }
      @media (max-width: 700px) {
        header {
          align-items: flex-start;
          padding: 15px;
        }
        .subtitle {
          display: none;
        }
        .controls {
          align-items: flex-end;
          flex-direction: column;
        }
        main {
          padding: 16px 14px 28px;
        }
        .camera-grid {
          grid-template-columns: 1fr;
        }
        .dashboard-layout {
          flex-direction: column;
        }
        .recent-panel {
          width: 100%;
          max-height: 260px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div>
          <h1>Video AI Operations Wall</h1>
          <div class="subtitle">Server-rendered fire, smoke, and plate annotations</div>
        </div>
      </div>
      <div class="controls">
        <div class="state" id="broadcastState"><span class="state-dot"></span><span>Connecting</span></div>
        <a class="docs-link" href="/docs" target="_blank" rel="noopener">API / Swagger</a>
        <a class="docs-link" href="/api/v1/diagnostics/fps?sample_seconds=5" target="_blank" rel="noopener">FPS diagnostics</a>
        <button id="wallFullscreenButton" type="button">Fullscreen wall</button>
        <button id="toggleButton" type="button" disabled>Loading…</button>
      </div>
    </header>
    <main>
      <div class="summary">
        <span id="cameraCount">Loading cameras…</span>
        <span id="receiverStats">Browser RX: 0.0 FPS · 0 frames</span>
        <span id="syncStatus">Synchronizing with API…</span>
      </div>
      <div class="dashboard-layout">
        <section class="camera-grid" id="cameraGrid" aria-live="polite"></section>
        <aside class="recent-panel" id="recentPanel">
          <div class="recent-header">
            <h2>Recent Detections</h2>
            <span class="count" id="recentCount">0</span>
          </div>
          <div class="recent-list" id="recentList">
            <div class="recent-empty">Waiting for detections…</div>
          </div>
        </aside>
      </div>
    </main>
    <script>
      const stateElement = document.getElementById("broadcastState");
      const toggleButton = document.getElementById("toggleButton");
      const cameraGrid = document.getElementById("cameraGrid");
      const cameraCount = document.getElementById("cameraCount");
      const receiverStats = document.getElementById("receiverStats");
      const syncStatus = document.getElementById("syncStatus");
      const wallFullscreenButton = document.getElementById("wallFullscreenButton");
      let sources = [];
      let broadcasting = false;
      let sourcesSignature = "";
      let synchronizationRunning = false;
      let broadcastSocket = null;
      let resultSocket = null;
      let reconnectTimer = null;
      let fullscreenSourceId = null;
      let previewBaseUrl = "";
      let previewAvailable = false;
      let useJpegFallback = false;
      const previewStates = new Map();
      const previewRetryTimers = new Map();
      const jpegBlobUrls = new Map();
      const OVERLAY_STALE_MS = 4000;
      const frameStats = new Map();
      const metricElements = new Map();
      let sessionReceivedFrames = 0;

      function statsFor(sourceId) {
        if (!frameStats.has(sourceId)) {
          frameStats.set(sourceId, {
            arrivals: [],
            total: 0,
            lastArrival: 0,
            frameIndex: null,
          });
        }
        return frameStats.get(sourceId);
      }

      function sourceSelector(sourceId) {
        return CSS.escape(String(sourceId));
      }

      function receivedFps(stats, now = performance.now()) {
        const windowStart = now - 3000;
        while (stats.arrivals.length && stats.arrivals[0] < windowStart) {
          stats.arrivals.shift();
        }
        if (stats.arrivals.length < 2 || now - stats.lastArrival > 1500) return 0;
        const elapsedSeconds = (stats.arrivals[stats.arrivals.length - 1] - stats.arrivals[0]) / 1000;
        return elapsedSeconds > 0 ? (stats.arrivals.length - 1) / elapsedSeconds : 0;
      }

      function updateFrameMetrics() {
        const now = performance.now();
        let totalFps = 0;
        for (const source of sources) {
          const stats = statsFor(source.source_uri);
          const fps = receivedFps(stats, now);
          if (source.enabled) totalFps += fps;
          const elements = metricElements.get(source.source_uri);
          if (elements) {
            elements.fps.textContent = `${fps.toFixed(1)} FPS`;
            elements.frames.textContent = `Received: ${stats.total.toLocaleString()}`;
            elements.index.textContent = stats.frameIndex === null ? "Source frame: —" : `Source frame: ${stats.frameIndex.toLocaleString()}`;
          }
        }
        receiverStats.textContent = `Browser RX: ${totalFps.toFixed(1)} FPS · ` + `${sessionReceivedFrames.toLocaleString()} frames`;
      }

      const taskLabel = (task) => (task === "fire_smoke" ? "Fire / Smoke" : task === "face_recognition" ? "Face Recognition" : "Plate Recognition");

      function clearJpegBlobs() {
        for (const [, entry] of jpegBlobUrls) {
          URL.revokeObjectURL(entry.url);
        }
        jpegBlobUrls.clear();
      }

      function renderSources() {
        for (const sourceId of previewStates.keys()) closePreview(sourceId);
        clearJpegBlobs();
        cameraGrid.innerHTML = "";
        metricElements.clear();
        for (const source of sources) {
          const escapedSourceId = escHtml(source.source_uri);
          const escapedSourceName = escHtml(source.name);
          const card = document.createElement("article");
          card.className = `camera-card${source.enabled ? "" : " offline"}`;
          card.dataset.sourceId = source.source_uri;
          const chips = source.tasks.map((task) => `<span class="task-chip ${task === "fire_smoke" ? "fire" : ""}">${taskLabel(task)}</span>`).join("");
          card.innerHTML = `
          <div class="stream-shell">
            <video aria-label="Live preview for ${escapedSourceName}" data-source-id="${escapedSourceId}" autoplay muted playsinline></video>
            <canvas data-overlay-for="${escapedSourceId}"></canvas>
            <img class="jpeg-fallback" data-jpeg-for="${escapedSourceId}" alt="JPEG fallback for ${escapedSourceName}" />
            <div class="stream-toolbar">
              <div class="stream-profile">
                <span class="fps-badge" data-fps-for="${escapedSourceId}">0.0 FPS</span>
                <span class="resolution-badge" data-resolution-for="${escapedSourceId}">Wall · waiting</span>
              </div>
              <button class="camera-fullscreen" type="button" data-fullscreen-source="${escapedSourceId}">Fullscreen</button>
            </div>
            <div class="stream-status" data-status-for="${escapedSourceId}">Waiting for source frames…</div>
          </div>
          <div class="card-info">
            <div class="camera-row">
              <span class="camera-name">${escapedSourceName}</span>
              <span class="camera-id">${escapedSourceId}</span>
            </div>
            <div class="frame-metrics">
              <span data-frames-for="${escapedSourceId}">Received: 0</span>
              <span data-index-for="${escapedSourceId}">Source frame: —</span>
            </div>
            <div class="task-list">${chips}</div>
          </div>`;
          const video = card.querySelector("video");
          const status = card.querySelector(".stream-status");
          metricElements.set(source.source_uri, {
            fps: card.querySelector("[data-fps-for]"),
            resolution: card.querySelector("[data-resolution-for]"),
            frames: card.querySelector("[data-frames-for]"),
            index: card.querySelector("[data-index-for]"),
          });
          video.addEventListener("playing", () => status.classList.add("hidden"));
          card.querySelector("[data-fullscreen-source]").addEventListener("click", async () => {
            if (document.fullscreenElement === card) {
              await document.exitFullscreen();
            } else {
              if (document.fullscreenElement) await document.exitFullscreen();
              await card.requestFullscreen();
            }
          });
          cameraGrid.appendChild(card);
        }
        cameraCount.textContent = `${sources.filter((source) => source.enabled).length} active cameras · ${sources.length} configured`;
        applyStreams();
        updateFrameMetrics();
      }

      function renderRecentDetections(message) {
        const list = document.getElementById("recentList");
        const countEl = document.getElementById("recentCount");
        if (!list) return;
        const detections = message.detections || [];
        countEl.textContent = detections.length;

        if (!detections.length) {
          list.innerHTML = '<div class="recent-empty">No detections</div>';
          return;
        }

        // Mark existing items so we can detect new ones
        for (const child of list.children) {
          if (child.dataset && child.dataset.logId) {
            child.dataset.seen = "true";
          }
        }

        for (const d of detections) {
          const existing = list.querySelector(`[data-log-id="${d.id}"]`);
          if (existing) {
            existing.dataset.seen = "true";
            existing.dataset.seen = "false";
            continue;
          }

      function escHtml(str) {
        if (!str) return "";
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function updateFrame(payload) {
        const view = new DataView(payload);
        if (view.byteLength < 5) return;
        const headerLength = view.getUint32(0, false);
        if (headerLength <= 0 || headerLength + 4 >= view.byteLength) return;
        const headerBytes = new Uint8Array(payload, 4, headerLength);
        const header = JSON.parse(new TextDecoder().decode(headerBytes));
        const video = document.querySelector(`video[data-source-id="${sourceSelector(header.source_id)}"]`);
        if (!video) return;
        const now = performance.now();
        const stats = statsFor(header.source_id);
        stats.arrivals.push(now);
        stats.total += 1;
        stats.lastArrival = now;
        stats.frameIndex = Number.isFinite(header.frame_index) ? header.frame_index : null;
        const elements = metricElements.get(header.source_id);
        if (elements && Number.isFinite(header.frame_width) && Number.isFinite(header.frame_height)) {
          const profile = header.render_profile === "full" ? "Full" : "Wall";
          elements.resolution.textContent = `${profile} · ${header.frame_width}×${header.frame_height}`;
        }
        sessionReceivedFrames += 1;
      }

      function waitForIceGathering(peer) {
        if (peer.iceGatheringState === "complete") return Promise.resolve();
        return new Promise((resolve) => {
          const changed = () => {
            if (peer.iceGatheringState !== "complete") return;
            peer.removeEventListener("icegatheringstatechange", changed);
            resolve();
          };
          peer.addEventListener("icegatheringstatechange", changed);
        });
      }

      function waitForIceGatheringBounded(peer) {
        return Promise.race([
          waitForIceGathering(peer),
          new Promise((_, reject) => window.setTimeout(() => reject(new Error("ICE gathering timed out")), 5000)),
        ]);
      }

      function scheduleOverlayFrame(video, callback) {
        if (typeof video.requestVideoFrameCallback === "function") {
          video.requestVideoFrameCallback(callback);
        } else {
          window.requestAnimationFrame(callback);
        }
      }

      function schedulePreviewRetry(sourceId) {
        if (previewRetryTimers.has(sourceId) || !broadcasting || !previewAvailable) return;
        previewRetryTimers.set(sourceId, window.setTimeout(() => {
          previewRetryTimers.delete(sourceId);
          const source = sources.find((item) => item.source_uri === sourceId);
          if (source?.enabled && broadcasting) openPreview(source);
        }, 1500));
      }

      async function closePreview(sourceId) {
        const timer = previewRetryTimers.get(sourceId);
        if (timer) window.clearTimeout(timer);
        previewRetryTimers.delete(sourceId);
        const state = previewStates.get(sourceId);
        previewStates.delete(sourceId);
        if (!state) return;
        state.closed = true;
        state.peer.close();
        state.video.srcObject = null;
        if (state.sessionUrl) {
          try {
            await fetch(state.sessionUrl, { method: "DELETE" });
          } catch (_) {
            // The MediaMTX session may already be gone after a network failure.
          }
        }
      }

      function overlayItems(result) {
        return [
          ...(result.data?.tracks || []),
          ...(result.data?.plates || []),
          ...(result.data?.faces || []),
          ...(result.data?.humans || []),
        ];
      }

      function drawOverlays(sourceId) {
        const state = previewStates.get(sourceId);
        if (!state || state.closed) return;
        const { video, canvas, taskResults } = state;
        const width = video.videoWidth || 1;
        const height = video.videoHeight || 1;
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
        const context = canvas.getContext("2d");
        context.clearRect(0, 0, width, height);
        const now = Date.now();
        for (const result of taskResults.values()) {
          if (now - result.receivedAt > OVERLAY_STALE_MS) continue;
          if (Number.isFinite(result.source_time_seconds) && Math.abs(video.currentTime - result.source_time_seconds) > 2) continue;
          const sourceWidth = result.frame_width || width;
          const sourceHeight = result.frame_height || height;
          context.strokeStyle = result.task === "fire_smoke" ? "#ff5c5c" : result.task === "face_recognition" ? "#42f59b" : "#42d7ff";
          context.lineWidth = Math.max(2, width / 500);
          for (const item of overlayItems(result)) {
            const bbox = item.bbox;
            if (!Array.isArray(bbox) || bbox.length < 4) continue;
            context.strokeRect(
              bbox[0] * width / sourceWidth,
              bbox[1] * height / sourceHeight,
              (bbox[2] - bbox[0]) * width / sourceWidth,
              (bbox[3] - bbox[1]) * height / sourceHeight,
            );
          }
        }
        scheduleOverlayFrame(video, () => drawOverlays(sourceId));
      }

      async function openPreview(source) {
        await closePreview(source.source_uri);
        if (!broadcasting || !previewAvailable || !source.enabled || !previewBaseUrl) return;
        const selector = sourceSelector(source.source_uri);
        const video = document.querySelector(`video[data-source-id="${selector}"]`);
        const canvas = document.querySelector(`[data-overlay-for="${selector}"]`);
        const status = document.querySelector(`[data-status-for="${selector}"]`);
        if (!video || !canvas) return;
        const peer = new RTCPeerConnection();
        const state = { peer, video, canvas, taskResults: new Map(), sessionUrl: null, closed: false };
        previewStates.set(source.source_uri, state);
        peer.addTransceiver("video", { direction: "recvonly" });
        peer.addEventListener("track", (event) => { video.srcObject = event.streams[0]; });
        peer.addEventListener("connectionstatechange", () => {
          if (["failed", "disconnected", "closed"].includes(peer.connectionState) && !state.closed) {
            closePreview(source.source_uri);
            schedulePreviewRetry(source.source_uri);
          }
        });
        try {
          await peer.setLocalDescription(await peer.createOffer());
          await waitForIceGatheringBounded(peer);
          const controller = new AbortController();
          const requestTimeout = window.setTimeout(() => controller.abort(), 5000);
          const response = await fetch(`${previewBaseUrl}/${source.preview_path}/whep`, {
            method: "POST",
            headers: { "Content-Type": "application/sdp" },
            body: peer.localDescription.sdp,
            signal: controller.signal,
          });
          window.clearTimeout(requestTimeout);
          if (!response.ok) throw new Error(`Preview HTTP ${response.status}`);
          const location = response.headers.get("Location");
          if (location) state.sessionUrl = new URL(location, response.url).href;
          await peer.setRemoteDescription({ type: "answer", sdp: await response.text() });
          scheduleOverlayFrame(video, () => drawOverlays(source.source_uri));
        } catch (error) {
          status.textContent = `Preview unavailable: ${error.message}`;
          status.classList.remove("hidden");
          await closePreview(source.source_uri);
          schedulePreviewRetry(source.source_uri);
        }
      }

      function connectResultSocket() {
        if (!broadcasting || !previewAvailable) return;
        if (resultSocket && [WebSocket.CONNECTING, WebSocket.OPEN].includes(resultSocket.readyState)) return;
        const scheme = window.location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(`${scheme}://${window.location.host}/api/v1/results/ws`);
        resultSocket = socket;
        socket.addEventListener("message", (event) => {
          if (resultSocket !== socket) return;
          const result = JSON.parse(event.data);
          if (!result.task || !result.source_id) return;
          const state = previewStates.get(result.source_id);
          if (!state) return;
          const taskResults = state.taskResults;
          result.receivedAt = Date.now();
          taskResults.set(result.task, result);
        });
        socket.addEventListener("close", () => {
          if (resultSocket !== socket) return;
          resultSocket = null;
          if (broadcasting && previewAvailable) window.setTimeout(connectResultSocket, 1000);
        });
      }

      function disconnectResultSocket() {
        if (!resultSocket) return;
        const socket = resultSocket;
        resultSocket = null;
        socket.close(1000, "Preview disabled");
      }

      function connectBroadcastSocket() {
        if (!broadcasting) return;
        if (broadcastSocket && [WebSocket.CONNECTING, WebSocket.OPEN].includes(broadcastSocket.readyState)) return;
        const scheme = window.location.protocol === "https:" ? "wss" : "ws";
        const parameters = new URLSearchParams();
        if (!useJpegFallback) {
          parameters.set("metadata_only", "true");
        }
        if (fullscreenSourceId) parameters.set("fullscreen_source", fullscreenSourceId);
        const socket = new WebSocket(`${scheme}://${window.location.host}/api/v1/broadcast/ws?${parameters}`);
        broadcastSocket = socket;
        socket.binaryType = "arraybuffer";
        socket.addEventListener("message", (event) => {
          if (broadcastSocket !== socket) return;
          try {
            if (event.data instanceof ArrayBuffer) {
              // Binary frame: 4-byte header length + JSON header + JPEG bytes
              const view = new DataView(event.data);
              if (view.byteLength < 5) return;
              const headerLength = view.getUint32(0, false);
              if (headerLength <= 0 || headerLength + 4 >= view.byteLength) return;
              const headerBytes = new Uint8Array(event.data, 4, headerLength);
              const header = JSON.parse(new TextDecoder().decode(headerBytes));
              if (!header.source_id) return;

              // Update frame stats
              const stats = statsFor(header.source_id);
              const now = performance.now();
              stats.arrivals.push(now);
              stats.total += 1;
              stats.lastArrival = now;
              stats.frameIndex = Number.isFinite(header.frame_index) ? header.frame_index : null;
              sessionReceivedFrames += 1;

              // Update resolution badge
              const elements = metricElements.get(header.source_id);
              if (elements && Number.isFinite(header.frame_width) && Number.isFinite(header.frame_height)) {
                elements.resolution.textContent = `${header.render_profile || "Annotated"} · ${header.frame_width}×${header.frame_height}`;
              }

              // Display JPEG on fallback img element
              if (useJpegFallback) {
                const jpegBytes = new Uint8Array(event.data, 4 + headerLength);
                const blob = new Blob([jpegBytes], { type: "image/jpeg" });
                const url = URL.createObjectURL(blob);
                const selector = sourceSelector(header.source_id);
                const img = document.querySelector(`img[data-jpeg-for="${selector}"]`);
                if (img) {
                  const prev = jpegBlobUrls.get(header.source_id);
                  if (prev) URL.revokeObjectURL(prev.url);
                  jpegBlobUrls.set(header.source_id, { url });
                  img.src = url;
                  // Hide status overlay when first frame arrives
                  const status = document.querySelector(`[data-status-for="${selector}"]`);
                  if (status) status.classList.add("hidden");
                }
              }
              return;
            }

            // JSON message
            const message = JSON.parse(event.data);
            if (message.type === "frame_metadata") {
              const stats = statsFor(message.source_id);
              const now = performance.now();
              stats.arrivals.push(now);
              stats.total += 1;
              stats.lastArrival = now;
              stats.frameIndex = message.frame_index;
              sessionReceivedFrames += 1;
            }
            if (message.type === "camera_changed") synchronizeDashboard();
            if (message.type === "recent_detections") {
              renderRecentDetections(message);
            }
          } catch (_) {
            // Ignore keepalives or extensions unknown to this dashboard version.
          }
        });
        socket.addEventListener("close", () => {
          if (broadcastSocket !== socket) return;
          broadcastSocket = null;
          if (broadcasting) {
            clearTimeout(reconnectTimer);
            reconnectTimer = window.setTimeout(connectBroadcastSocket, 1000);
          }
        });
      }

      function disconnectBroadcastSocket() {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
        if (broadcastSocket) {
          const socket = broadcastSocket;
          broadcastSocket = null;
          socket.close(1000, "Broadcast disabled");
        }
      }

      function reconnectBroadcastSocket() {
        if (!broadcasting) return;
        disconnectBroadcastSocket();
        connectBroadcastSocket();
      }

      function applyStreams() {
        for (const video of document.querySelectorAll("video[data-source-id]")) {
          const sourceId = video.dataset.sourceId;
          const source = sources.find((item) => item.source_uri === sourceId);
          const selector = sourceSelector(sourceId);
          const status = document.querySelector(`[data-status-for="${selector}"]`);
          const img = document.querySelector(`img[data-jpeg-for="${selector}"]`);
          if (!source?.enabled) {
            closePreview(sourceId);
            video.style.display = "none";
            if (img) img.style.display = "none";
            status.textContent = "Source disabled in task manager";
            status.classList.remove("hidden");
            continue;
          }
          if (!broadcasting) {
            // Broadcast disabled
            closePreview(sourceId);
            video.style.display = "";
            if (img) img.style.display = "none";
            status.textContent = "Frontend broadcast disabled";
            status.classList.remove("hidden");
            continue;
          }
          // JPEG fallback is the primary display - annotated frames from broadcast hub
          if (img) img.style.display = "block";
          status.textContent = "Waiting for source frames…";
          status.classList.remove("hidden");
          // WebRTC preview is an optional enhancement when available
          if (previewAvailable) {
            video.style.display = "";
            if (source) openPreview(source);
          } else {
            closePreview(sourceId);
            video.style.display = "none";
          }
        }
        if (broadcasting) {
          connectBroadcastSocket();
          connectResultSocket();
        } else {
          disconnectBroadcastSocket();
          disconnectResultSocket();
        }
      }

      function showState(enabled) {
        const changed = broadcasting !== enabled;
        broadcasting = enabled;
        stateElement.classList.toggle("live", enabled);
        stateElement.querySelector("span:last-child").textContent = enabled ? "Broadcast live" : "Broadcast stopped";
        toggleButton.disabled = false;
        toggleButton.textContent = enabled ? "Stop frontend broadcast" : "Start frontend broadcast";
        toggleButton.classList.toggle("stop", enabled);
        if (changed) applyStreams();
      }

      function signatureFor(items) {
        return JSON.stringify(
          items.map((source) => ({
            source_uri: source.source_uri,
            name: source.name,
            enabled: source.enabled,
            tasks: [...source.tasks].sort(),
            frame_width: source.frame_width,
            frame_height: source.frame_height,
            preview_path: source.preview_path,
          })),
        );
      }

      async function synchronizeDashboard() {
        if (synchronizationRunning) return;
        synchronizationRunning = true;
        try {
          const [sourcesResponse, stateResponse] = await Promise.all([fetch("/api/v1/sources/preview-config", { cache: "no-store" }), fetch("/api/v1/broadcast/state", { cache: "no-store" })]);
          if (!sourcesResponse.ok || !stateResponse.ok) throw new Error("API unavailable");
          const previewConfig = await sourcesResponse.json();
          previewBaseUrl = previewConfig.whep_base_url;
          previewAvailable = previewConfig.enabled;
          // JPEG fallback shows server-annotated frames directly from the broadcast hub.
          // WebRTC (preview) is tried as a higher-quality overlay when available.
          // The broadcast hub renders annotated frames for ALL enabled cameras.
          useJpegFallback = true;
          const nextSources = previewConfig.sources;
          const state = await stateResponse.json();
          showState(state.enabled);
          const nextSignature = signatureFor(nextSources);
          if (nextSignature !== sourcesSignature) {
            sources = nextSources;
            sourcesSignature = nextSignature;
            renderSources();
          }
          syncStatus.textContent = `API synchronized · ${new Date().toLocaleTimeString()} · ${useJpegFallback ? "JPEG fallback" : "WebRTC"}`;
        } catch (error) {
          stateElement.querySelector("span:last-child").textContent = "API unavailable";
          syncStatus.textContent = `Synchronization failed: ${error.message}`;
        } finally {
          synchronizationRunning = false;
        }
      }

      toggleButton.addEventListener("click", async () => {
        toggleButton.disabled = true;
        try {
          const response = await fetch("/api/v1/broadcast/state", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ enabled: !broadcasting }),
          });
          if (!response.ok) throw new Error("Could not change broadcast state");
          const state = await response.json();
          showState(state.enabled);
        } catch (error) {
          toggleButton.disabled = false;
          stateElement.querySelector("span:last-child").textContent = error.message;
        }
      });

      wallFullscreenButton.addEventListener("click", async () => {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.documentElement.requestFullscreen();
        }
      });

      document.addEventListener("fullscreenchange", () => {
        const fullscreenElement = document.fullscreenElement;
        const nextFullscreenSourceId = fullscreenElement?.classList.contains("camera-card") ? fullscreenElement.dataset.sourceId : null;
        if (nextFullscreenSourceId !== fullscreenSourceId) {
          fullscreenSourceId = nextFullscreenSourceId;
          reconnectBroadcastSocket();
        }
        wallFullscreenButton.textContent = fullscreenElement === document.documentElement ? "Exit fullscreen" : "Fullscreen wall";
        for (const button of document.querySelectorAll("[data-fullscreen-source]")) {
          button.textContent = fullscreenElement === button.closest(".camera-card") ? "Exit fullscreen" : "Fullscreen";
        }
      });

      window.addEventListener("beforeunload", () => {
        for (const sourceId of previewStates.keys()) closePreview(sourceId);
        clearJpegBlobs();
        disconnectBroadcastSocket();
        disconnectResultSocket();
      });

      synchronizeDashboard();
      window.setInterval(synchronizeDashboard, 2000);
      window.setInterval(updateFrameMetrics, 500);
    </script>
  </body>
</html>
