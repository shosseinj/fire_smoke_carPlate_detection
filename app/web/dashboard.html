<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>دیوار عملیات هوش مصنوعی ویدیو</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070a11;
        --panel: #101621;
        --panel-2: #151d2b;
        --line: #263246;
        --text: #f5f7fb;
        --muted: #91a0b7;
        --cyan: #27d3ff;
        --green: #38dc86;
        --orange: #ffad42;
        --red: #ff5263;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 15% -10%, rgba(39, 211, 255, 0.12), transparent 32rem), radial-gradient(circle at 95% 0%, rgba(56, 220, 134, 0.08), transparent 28rem), var(--bg);
        color: var(--text);
        font:
          14px/1.45 Tahoma,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 18px 24px;
        border-bottom: 1px solid rgba(145, 160, 183, 0.18);
        background: rgba(7, 10, 17, 0.88);
        backdrop-filter: blur(18px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand-mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid rgba(39, 211, 255, 0.45);
        border-radius: 12px;
        background: rgba(39, 211, 255, 0.1);
        color: var(--cyan);
        font-weight: 900;
        letter-spacing: -0.05em;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.01em;
      }
      .subtitle {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .docs-link {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 12px;
        color: #b9c7db;
        text-decoration: none;
        font-size: 12px;
        font-weight: 750;
        transition: 0.18s ease;
      }
      .docs-link:hover {
        border-color: var(--cyan);
        color: var(--text);
      }
      .state {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .state-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 0 4px rgba(255, 82, 99, 0.12);
      }
      .state.live .state-dot {
        background: var(--green);
        box-shadow:
          0 0 0 4px rgba(56, 220, 134, 0.12),
          0 0 16px rgba(56, 220, 134, 0.55);
      }
      button {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 14px;
        background: var(--panel-2);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-weight: 750;
        transition: 0.18s ease;
      }
      button:hover {
        border-color: var(--cyan);
        transform: translateY(-1px);
      }
      button.stop {
        border-color: rgba(255, 82, 99, 0.4);
        color: #ff9aa5;
      }
      button:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 2px;
      }
      main {
        padding: 22px 24px 36px;
      }
      .summary {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 16px;
        color: var(--muted);
        font-size: 12px;
      }
      .camera-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }
      .camera-card {
        overflow: hidden;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: linear-gradient(145deg, rgba(21, 29, 43, 0.96), rgba(11, 15, 24, 0.98));
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
      }
      .stream-shell {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: #03050a;
      }
      .stream-toolbar {
        position: absolute;
        inset: 10px 10px auto 10px;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        pointer-events: none;
      }
      .stream-profile {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .fps-badge {
        border: 1px solid rgba(56, 220, 134, 0.35);
        border-radius: 999px;
        padding: 5px 9px;
        background: rgba(3, 8, 13, 0.8);
        color: #83f4b5;
        font:
          800 11px/1 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(8px);
      }
      .resolution-badge {
        border: 1px solid rgba(39, 211, 255, 0.32);
        border-radius: 999px;
        padding: 5px 9px;
        background: rgba(3, 8, 13, 0.8);
        color: #8eeaff;
        font:
          800 11px/1 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        backdrop-filter: blur(8px);
      }
      .camera-fullscreen {
        padding: 6px 9px;
        border-color: rgba(145, 160, 183, 0.35);
        border-radius: 8px;
        background: rgba(3, 8, 13, 0.8);
        font-size: 11px;
        pointer-events: auto;
        backdrop-filter: blur(8px);
      }
      .stream-shell video,
      .stream-shell canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .stream-shell canvas {
        pointer-events: none;
      }
      .jpeg-fallback {
        position: absolute;
        inset: 0;
        display: none;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #03050a;
      }
      .stream-status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        background: repeating-linear-gradient(-45deg, #0a0e16, #0a0e16 8px, #0d121c 8px, #0d121c 16px);
        color: var(--muted);
        text-align: center;
        font-size: 12px;
        letter-spacing: 0.04em;
        pointer-events: none;
      }
      .stream-status.hidden {
        display: none;
      }
      .card-info {
        padding: 12px 13px 13px;
      }
      .camera-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .camera-name {
        overflow: hidden;
        font-weight: 800;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .camera-id {
        color: var(--muted);
        font:
          11px ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
      }
      .frame-metrics {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 9px;
        color: var(--muted);
        font:
          11px ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
      }
      .task-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .task-chip {
        border: 1px solid rgba(39, 211, 255, 0.28);
        border-radius: 999px;
        padding: 4px 8px;
        background: rgba(39, 211, 255, 0.08);
        color: #8eeaff;
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .task-chip.fire {
        border-color: rgba(255, 173, 66, 0.35);
        background: rgba(255, 173, 66, 0.09);
        color: #ffc779;
      }
      .offline {
        opacity: 0.55;
      }
      .camera-card:fullscreen {
        display: flex;
        width: 100vw;
        height: 100vh;
        flex-direction: column;
        border: 0;
        border-radius: 0;
        background: #000;
      }
      .camera-card:fullscreen .stream-shell {
        flex: 1;
        aspect-ratio: auto;
      }
      .camera-card:fullscreen .card-info {
        background: #090d15;
      }
      .dashboard-layout {
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }
      .dashboard-layout .camera-grid {
        flex: 1;
        min-width: 0;
      }
      .recent-panel {
        width: 340px;
        flex-shrink: 0;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: linear-gradient(145deg, rgba(21, 29, 43, 0.96), rgba(11, 15, 24, 0.98));
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
        max-height: calc(100vh - 140px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .recent-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--line);
      }
      .recent-header h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .recent-header .count {
        border-radius: 999px;
        padding: 2px 8px;
        background: var(--panel-2);
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
      }
      .recent-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }
      .recent-item {
        display: flex;
        gap: 10px;
        padding: 8px;
        border-radius: 10px;
        transition: background 0.15s;
        cursor: default;
      }
      .recent-item:hover {
        background: rgba(39, 211, 255, 0.05);
      }
      .recent-item + .recent-item {
        margin-top: 4px;
      }
      .recent-item.new {
        animation: recentFadeIn 0.35s ease;
      }
      @keyframes recentFadeIn {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .recent-face {
        width: 112px;
        height: 56px;
        border-radius: 8px;
        object-fit: contain;
        object-position: center;
        flex-shrink: 0;
        background: var(--panel-2);
      }

      .recent-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .recent-info .name {
        font-weight: 700;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .recent-info .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        font-size: 11px;
        color: var(--muted);
      }
      .recent-info .meta span {
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .recent-info .meta .granted {
        color: var(--green);
      }
      .recent-info .meta .denied {
        color: var(--red);
      }
      .recent-info .classification {
        display: inline-block;
        border-radius: 999px;
        padding: 1px 6px;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
      }
      .classification.known {
        background: rgba(56, 220, 134, 0.15);
        color: var(--green);
      }
      .classification.unsure {
        background: rgba(255, 173, 66, 0.15);
        color: var(--orange);
      }
      .classification.unknown {
        background: rgba(255, 82, 99, 0.15);
        color: var(--red);
      }
      .recent-empty {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        padding: 32px 16px;
      }
      @media (max-width: 1250px) {
        .camera-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .dashboard-layout {
          flex-direction: column;
        }
        .recent-panel {
          width: 100%;
          max-height: 320px;
        }
      }
      @media (max-width: 700px) {
        header {
          align-items: flex-start;
          padding: 15px;
        }
        .subtitle {
          display: none;
        }
        .controls {
          align-items: flex-end;
          flex-direction: column;
        }
        main {
          padding: 16px 14px 28px;
        }
        .camera-grid {
          grid-template-columns: 1fr;
        }
        .dashboard-layout {
          flex-direction: column;
        }
        .recent-panel {
          width: 100%;
          max-height: 260px;
        }
      }
      .live-branch-section { padding: 24px; }
      .live-branch-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
       .live-branch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 320px)); gap: 16px; }
       .live-branch-card { width: 320px; cursor: pointer; background: #152536; border-radius: 10px; padding: 8px; }
       .live-branch-media { position: relative; width: 320px; height: 320px; }
       .live-branch-card video { display: block; width: 320px; height: 320px; object-fit: contain; background: #000; }
       .live-branch-metrics { position: absolute; top: 8px; left: 8px; right: 8px; z-index: 2; padding: 4px 7px; color: #fff; background: rgba(0,0,0,.72); border-radius: 4px; font: 12px/1.3 monospace; text-align: left; pointer-events: none; }
      .live-branch-card h3 { margin: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .live-branch-card [data-live-status] { color: #ffd166; min-height: 1.5em; padding: 4px; }
      .live-branch-error { color: #ff8b8b; background: #421d28; padding: 10px; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div>
          <h1>دیوار عملیات هوش مصنوعی ویدیو</h1>
          <div class="subtitle">نمایش برچسب‌های آتش، دود و پلاک پردازش‌شده در سرور</div>
        </div>
      </div>
      <div class="controls">
        <div class="state" id="broadcastState"><span class="state-dot"></span><span>در حال اتصال</span></div>
        <a class="docs-link" href="/docs" target="_blank" rel="noopener">مستندات API</a>
        <a class="docs-link" href="/api/v1/diagnostics/fps?sample_seconds=5" target="_blank" rel="noopener">عیب‌یابی نرخ فریم</a>
          <button id="wallFullscreenButton" type="button">نمایش تمام‌صفحه دیوار</button>
          <button id="liveBranchButton" type="button">See live branch</button>
        <button id="streamModeButton" type="button">جریان هوش مصنوعی</button>
        <button id="toggleButton" type="button" disabled>در حال بارگذاری…</button>
      </div>
    </header>
    <main>
      <div class="summary">
        <span id="cameraCount">در حال بارگذاری دوربین‌ها…</span>
        <span id="receiverStats">دریافت مرورگر: ۰٫۰ فریم‌برثانیه · ۰ فریم</span>
        <span id="syncStatus">در حال همگام‌سازی با API…</span>
      </div>
      <div class="dashboard-layout">
        <section class="camera-grid" id="cameraGrid" aria-live="polite"></section>
        <aside class="recent-panel" id="recentPanel">
          <div class="recent-header">
            <h2>تشخیص‌های اخیر</h2>
            <span class="count" id="recentCount">0</span>
          </div>
          <div class="recent-list" id="recentList">
            <div class="recent-empty">در انتظار تشخیص…</div>
          </div>
        </aside>
      </div>
    </main>
    <section id="liveBranchSection" class="live-branch-section" hidden aria-live="polite">
      <div class="live-branch-header">
        <h2>شاخه زنده GPU</h2>
        <button id="liveBranchBack" type="button">بازگشت به پیش‌نمایش</button>
      </div>
      <div id="liveBranchError" class="live-branch-error" role="alert" hidden></div>
      <div id="liveBranchGrid" class="live-branch-grid"></div>
    </section>
    <script>
      const stateElement = document.getElementById("broadcastState");
      const toggleButton = document.getElementById("toggleButton");
      const cameraGrid = document.getElementById("cameraGrid");
      const cameraCount = document.getElementById("cameraCount");
      const receiverStats = document.getElementById("receiverStats");
      const syncStatus = document.getElementById("syncStatus");
      const wallFullscreenButton = document.getElementById("wallFullscreenButton");
      const streamModeButton = document.getElementById("streamModeButton");
      const liveBranchButton = document.getElementById("liveBranchButton");
      const liveBranchSection = document.getElementById("liveBranchSection");
      const liveBranchGrid = document.getElementById("liveBranchGrid");
      const liveBranchError = document.getElementById("liveBranchError");
      const liveBranchBack = document.getElementById("liveBranchBack");
      let sources = [];
      let liveBranchSources = [];
      let broadcasting = false;
      let sourcesSignature = "";
      let synchronizationRunning = false;
      let broadcastSocket = null;
      let resultSocket = null;
      let reconnectTimer = null;
      let fullscreenSourceId = null;
      let previewBaseUrl = "";
      let previewAvailable = false;
      let useJpegFallback = false;
      let sourceOnlyWall = true;
      const previewStates = new Map();
      const previewRetryTimers = new Map();
      const jpegBlobUrls = new Map();
      const OVERLAY_STALE_MS = 4000;
      const frameStats = new Map();
      const metricElements = new Map();
      let sessionReceivedFrames = 0;
      let liveBranchView = false;
      let liveBranchFullscreen = null;
      const liveBranchStates = new Map();
      let liveBranchHeartbeatTimer = null;

      function showLiveBranchError(message) {
        liveBranchError.textContent = message;
        liveBranchError.hidden = false;
      }

      function clearLiveBranchError() {
        liveBranchError.textContent = "";
        liveBranchError.hidden = true;
      }

      function liveBranchStatus(card, message) {
        const status = card.querySelector("[data-live-status]");
        if (status) { status.textContent = message; status.hidden = false; }
      }

      async function releaseLiveBranch(state) {
        if (!state || state.released) return;
        state.released = true;
        if (state.peer) state.peer.close();
        state.video.srcObject = null;
        try {
          await fetch(`/api/v1/live-branch/${state.profile}/release`, {
            method: "DELETE", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ source_uri: state.sourceUri, session_id: state.sessionId }),
            keepalive: true,
          });
        } catch (_) { /* unload/network cleanup is best effort */ }
      }

      function startLiveBranchMetrics(video, card, profile, result) {
        const metrics = card.querySelector(".live-branch-metrics");
        if (!metrics) return;
        let frames = 0;
        let windowStart = performance.now();
        const render = () => {
          const width = video.videoWidth || result.width || 0;
          const height = video.videoHeight || result.height || 0;
          const elapsed = Math.max(1, performance.now() - windowStart) / 1000;
          const fps = frames > 0 ? (frames / elapsed).toFixed(1) : "--";
          metrics.textContent = `FPS: ${fps} · RES: ${width}×${height} · ${profile}`;
          if (elapsed >= 1) { frames = 0; windowStart = performance.now(); }
        };
        video.addEventListener("loadedmetadata", render, { once: false });
        if (typeof video.requestVideoFrameCallback === "function") {
          const frame = () => { frames += 1; render(); video.requestVideoFrameCallback(frame); };
          video.requestVideoFrameCallback(frame);
        } else {
          window.setInterval(render, 500);
        }
      }

      async function acquireLiveBranch(source, profile, video, card) {
        const previous = liveBranchStates.get(`${source.source_uri}:${profile}`);
        if (previous) await releaseLiveBranch(previous);
        const state = { sourceUri: source.source_uri, profile, video, card, peer: null, sessionId: null, released: false };
        liveBranchStates.set(`${source.source_uri}:${profile}`, state);
        try {
          const response = await fetch(`/api/v1/live-branch/${profile}/acquire`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ source_uri: source.source_uri, client_id: `dashboard-${location.pathname}` }),
          });
          const result = await response.json();
          if (!response.ok || result.enabled === false) throw new Error(result.detail || "شاخه زنده غیرفعال است");
           state.sessionId = result.session_id;
           if (result.width && result.height) {
             card.dataset.nativeWidth = String(result.width);
             card.dataset.nativeHeight = String(result.height);
           }
           startLiveBranchMetrics(video, card, profile, result);
          const peer = new RTCPeerConnection();
          state.peer = peer;
          peer.addTransceiver("video", { direction: "recvonly" });
          peer.addEventListener("track", (event) => { video.srcObject = event.streams[0]; });
          peer.addEventListener("connectionstatechange", () => {
            if (["failed", "disconnected", "closed"].includes(peer.connectionState) && !state.released) {
              liveBranchStatus(card, `اتصال شاخه زنده قطع شد (${peer.connectionState})`);
            }
          });
          await peer.setLocalDescription(await peer.createOffer());
          await waitForIceGatheringBounded(peer);
          let whep;
          for (let attempt = 0; attempt < 10; attempt += 1) {
            whep = await fetch(result.whep_url, {
              method: "POST", headers: { "Content-Type": "application/sdp" }, body: peer.localDescription.sdp,
            });
            if (whep.status !== 404 || attempt === 9) break;
            await new Promise((resolve) => window.setTimeout(resolve, 250));
          }
          if (!whep.ok) throw new Error(`مذاکره WHEP با کد ${whep.status} شکست خورد`);
          await peer.setRemoteDescription({ type: "answer", sdp: await whep.text() });
          try { await video.play(); } catch (error) { throw new Error(`پخش ویدیو رد شد: ${error.message}`); }
          liveBranchStatus(card, "در حال پخش زنده");
          return state;
        } catch (error) {
          liveBranchStatus(card, `خطای بارگذاری منبع: ${error.message}`);
          showLiveBranchError(error.message);
          await releaseLiveBranch(state);
          return null;
        }
      }

      function renderLiveBranch() {
        liveBranchGrid.innerHTML = "";
        clearLiveBranchError();
         for (const source of liveBranchSources.filter((item) => item.enabled && item.active !== false)) {
           const card = document.createElement("article");
           card.className = "live-branch-card";
           card.dataset.nativeWidth = String(source.frame_width || 0);
           card.dataset.nativeHeight = String(source.frame_height || 0);
           const title = document.createElement("h3"); title.textContent = source.name || source.source_uri;
           const media = document.createElement("div"); media.className = "live-branch-media";
           const video = document.createElement("video");
           video.autoplay = true; video.muted = true; video.playsInline = true;
           video.dataset.sourceUri = source.source_uri;
           const metrics = document.createElement("div"); metrics.className = "live-branch-metrics"; metrics.textContent = "FPS: -- · RES: --";
           media.append(video, metrics);
           const status = document.createElement("div"); status.dataset.liveStatus = "true"; status.textContent = "در حال دریافت…";
           card.append(title, media, status); liveBranchGrid.appendChild(card);
          card.addEventListener("click", () => openLiveBranchFullscreen(source, card, video));
           acquireLiveBranch(source, "wall", video, card);
        }
        if (!liveBranchGrid.children.length) showLiveBranchError("منبع فعالی برای شاخه زنده وجود ندارد");
      }

      async function openLiveBranchFullscreen(source, card, video) {
        if (liveBranchFullscreen && liveBranchFullscreen.sourceUri === source.source_uri) return;
        // requestFullscreen must run synchronously in the tile click's user
        // activation. Awaiting release/acquire first makes browsers reject it
        // with "Permissions check failed".
        const fullscreenRequest = document.fullscreenElement
          ? Promise.reject(new Error("Exit the current fullscreen view first"))
          : video.requestFullscreen();
        const wall = liveBranchStates.get(`${source.source_uri}:wall`);
        // Keep the already-playing wall stream in the visible element. The
        // native branch is negotiated on a detached muted video and swapped
        // in only after it is actually playable, so fullscreen never blanks.
        const nativeVideo = document.createElement("video");
        nativeVideo.autoplay = true; nativeVideo.muted = true; nativeVideo.playsInline = true;
        const state = await acquireLiveBranch(source, "fullscreen", nativeVideo, card);
        if (!state) { try { await fullscreenRequest; } catch (error) { liveBranchStatus(card, `تمام‌صفحه رد شد: ${error.message}`); } return; }
        video.srcObject = nativeVideo.srcObject;
        try { await video.play(); } catch (_) { /* the native peer is already playing */ }
        state.video = video;
        if (wall) await releaseLiveBranch(wall);
        liveBranchFullscreen = state;
        try { await fullscreenRequest; } catch (error) { liveBranchStatus(card, `تمام‌صفحه رد شد: ${error.message}`); }
      }

      async function closeLiveBranchView() {
        if (document.fullscreenElement) await document.exitFullscreen().catch(() => {});
        for (const state of liveBranchStates.values()) await releaseLiveBranch(state);
        liveBranchStates.clear(); liveBranchFullscreen = null;
        if (liveBranchHeartbeatTimer) window.clearInterval(liveBranchHeartbeatTimer);
        liveBranchHeartbeatTimer = null;
      }

      function setLiveBranchView(enabled) {
        liveBranchView = enabled;
        liveBranchSection.hidden = !enabled;
        document.querySelector("main").hidden = enabled;
        liveBranchButton.setAttribute("aria-pressed", String(enabled));
        if (enabled) { history.replaceState(null, "", "#live-branch"); renderLiveBranch(); liveBranchHeartbeatTimer = window.setInterval(() => {
          for (const state of [...liveBranchStates.values()]) if (state.sessionId && !state.released) fetch(`/api/v1/live-branch/${state.profile}/heartbeat`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ source_uri: state.sourceUri, session_id: state.sessionId }) }).then(async (heartbeat) => {
            if (heartbeat.ok) return;
            if (heartbeat.status === 409 && state.profile === "wall" && liveBranchView) {
              await releaseLiveBranch(state);
              const source = liveBranchSources.find((item) => item.source_uri === state.sourceUri);
              if (source) await acquireLiveBranch(source, "wall", state.video, state.card);
              return;
            }
            liveBranchStatus(state.card, "خطای heartbeat شاخه زنده");
          }).catch(() => liveBranchStatus(state.card, "خطای heartbeat شاخه زنده"));

      function statsFor(sourceId) {
        if (!frameStats.has(sourceId)) {
          frameStats.set(sourceId, {
            arrivals: [],
            total: 0,
            lastArrival: 0,
            frameIndex: null,
          });
        }
        return frameStats.get(sourceId);

      function sourceSelector(sourceId) {
        return CSS.escape(String(sourceId));

      function receivedFps(stats, now = performance.now()) {
        const windowStart = now - 3000;
        while (stats.arrivals.length && stats.arrivals[0] < windowStart) {
          stats.arrivals.shift();
        }
        if (stats.arrivals.length < 2 || now - stats.lastArrival > 1500) return 0;
        const elapsedSeconds = (stats.arrivals[stats.arrivals.length - 1] - stats.arrivals[0]) / 1000;
        return elapsedSeconds > 0 ? (stats.arrivals.length - 1) / elapsedSeconds : 0;
      }

      function updateFrameMetrics() {
        const now = performance.now();
        let totalFps = 0;
        for (const source of sources) {
          const stats = statsFor(source.source_uri);
          const fps = receivedFps(stats, now);
          if (source.enabled) totalFps += fps;
          const elements = metricElements.get(source.source_uri);
          if (elements) {
            elements.fps.textContent = `${fps.toFixed(1)} FPS`;
            elements.frames.textContent = `دریافت‌شده: ${stats.total.toLocaleString("fa-IR")}`;
            elements.index.textContent = stats.frameIndex === null ? "فریم منبع: —" : `فریم منبع: ${stats.frameIndex.toLocaleString("fa-IR")}`;
          }
        }
        receiverStats.textContent = `دریافت مرورگر: ${totalFps.toFixed(1)} فریم‌برثانیه · ` + `${sessionReceivedFrames.toLocaleString("fa-IR")} فریم`;

      function escHtml(str) {
        if (!str) return "";
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;

      function updateFrame(payload) {
        const view = new DataView(payload);
        if (view.byteLength < 5) return;
        const headerLength = view.getUint32(0, false);
        if (headerLength <= 0 || headerLength + 4 >= view.byteLength) return;
        const headerBytes = new Uint8Array(payload, 4, headerLength);
        const header = JSON.parse(new TextDecoder().decode(headerBytes));
        const video = document.querySelector(`video[data-source-id="${sourceSelector(header.source_id)}"]`);
        if (!video) return;
        const now = performance.now();
        const stats = statsFor(header.source_id);
        const incomingFrameIndex = Number.isFinite(header.frame_index) ? header.frame_index : null;
        if (
          incomingFrameIndex !== null
          && stats.frameIndex !== null
          && incomingFrameIndex < stats.frameIndex
        ) return;
        stats.arrivals.push(now);
        stats.total += 1;
        stats.lastArrival = now;
        stats.frameIndex = incomingFrameIndex;
        const elements = metricElements.get(header.source_id);
        if (elements && Number.isFinite(header.frame_width) && Number.isFinite(header.frame_height)) {
          const profile = header.render_profile === "full" ? "کامل" : "دیوار";
          elements.resolution.textContent = `${profile} · ${header.frame_width}×${header.frame_height}`;
        }
        sessionReceivedFrames += 1;
      }

      function waitForIceGathering(peer) {
        if (peer.iceGatheringState === "complete") return Promise.resolve();
        return new Promise((resolve) => {
          const changed = () => {
            if (peer.iceGatheringState !== "complete") return;
            peer.removeEventListener("icegatheringstatechange", changed);
            resolve();
          };
          peer.addEventListener("icegatheringstatechange", changed);
        });
      }

      function waitForIceGatheringBounded(peer) {
        return Promise.race([
          waitForIceGathering(peer),
          new Promise((_, reject) => window.setTimeout(() => reject(new Error("زمان گردآوری اطلاعات اتصال به پایان رسید")), 5000)),
        ]);
      }

      function scheduleOverlayFrame(video, callback) {
        if (typeof video.requestVideoFrameCallback === "function") {
          video.requestVideoFrameCallback(callback);
        } else {
          window.requestAnimationFrame(callback);
        }
      }

      function schedulePreviewRetry(sourceId) {
        if (previewRetryTimers.has(sourceId) || !broadcasting || !previewAvailable) return;
        previewRetryTimers.set(sourceId, window.setTimeout(() => {
          previewRetryTimers.delete(sourceId);
          const source = sources.find((item) => item.source_uri === sourceId);
          if (source?.enabled && broadcasting) openPreview(source);
        }, 1500));
      }

      async function closePreview(sourceId) {
        const timer = previewRetryTimers.get(sourceId);
        if (timer) window.clearTimeout(timer);
        previewRetryTimers.delete(sourceId);
        const state = previewStates.get(sourceId);
        previewStates.delete(sourceId);
        if (!state) return;
        state.closed = true;
        state.peer.close();
        state.video.srcObject = null;
        if (state.sessionUrl) {
          try {
            await fetch(state.sessionUrl, { method: "DELETE" });
          } catch (_) {
            // The MediaMTX session may already be gone after a network failure.
          }
        }
      }

      function overlayItems(result) {
        return [
          ...(result.data?.tracks || []),
          ...(result.data?.plates || []),
          ...(result.data?.faces || []),
          ...(result.data?.humans || []),
        ];
      }

      function drawOverlays(sourceId) {
        const state = previewStates.get(sourceId);
        if (!state || state.closed) return;
        const { video, canvas, taskResults } = state;
        const width = video.videoWidth || 1;
        const height = video.videoHeight || 1;
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
        const context = canvas.getContext("2d");
        context.clearRect(0, 0, width, height);
        const now = Date.now();
        for (const result of taskResults.values()) {
          if (now - result.receivedAt > OVERLAY_STALE_MS) continue;
          if (Number.isFinite(result.source_time_seconds) && Math.abs(video.currentTime - result.source_time_seconds) > 2) continue;
          const sourceWidth = result.frame_width || width;
          const sourceHeight = result.frame_height || height;
          context.strokeStyle = result.task === "fire_smoke" ? "#ff5c5c" : result.task === "face_recognition" ? "#42f59b" : "#42d7ff";
          context.lineWidth = Math.max(2, width / 500);
          for (const item of overlayItems(result)) {
            const bbox = item.bbox;
            if (!Array.isArray(bbox) || bbox.length < 4) continue;
            context.strokeRect(
              bbox[0] * width / sourceWidth,
              bbox[1] * height / sourceHeight,
              (bbox[2] - bbox[0]) * width / sourceWidth,
              (bbox[3] - bbox[1]) * height / sourceHeight,
            );
          }
        }
        scheduleOverlayFrame(video, () => drawOverlays(sourceId));
      }

      async function openPreview(source) {
        await closePreview(source.source_uri);
        if (!broadcasting || !previewAvailable || !source.enabled || !previewBaseUrl) return;
        const selector = sourceSelector(source.source_uri);
        const video = document.querySelector(`video[data-source-id="${selector}"]`);
        const canvas = document.querySelector(`[data-overlay-for="${selector}"]`);
        const status = document.querySelector(`[data-status-for="${selector}"]`);
        if (!video || !canvas) return;
        const peer = new RTCPeerConnection();
        const state = { peer, video, canvas, taskResults: new Map(), sessionUrl: null, closed: false };
        previewStates.set(source.source_uri, state);
        peer.addTransceiver("video", { direction: "recvonly" });
        peer.addEventListener("track", (event) => { video.srcObject = event.streams[0]; });
        peer.addEventListener("connectionstatechange", () => {
          if (["failed", "disconnected", "closed"].includes(peer.connectionState) && !state.closed) {
            closePreview(source.source_uri);
            schedulePreviewRetry(source.source_uri);
          }
        });
        try {
          await peer.setLocalDescription(await peer.createOffer());
          await waitForIceGatheringBounded(peer);
          const controller = new AbortController();
          const requestTimeout = window.setTimeout(() => controller.abort(), 5000);
          const response = await fetch(`${previewBaseUrl}/${source.preview_path}/whep`, {
            method: "POST",
            headers: { "Content-Type": "application/sdp" },
            body: peer.localDescription.sdp,
            signal: controller.signal,
          });
          window.clearTimeout(requestTimeout);
          if (!response.ok) throw new Error(`پیش‌نمایش با کد ${response.status} پاسخ داد`);
          const location = response.headers.get("Location");
          if (location) state.sessionUrl = new URL(location, response.url).href;
          await peer.setRemoteDescription({ type: "answer", sdp: await response.text() });
          scheduleOverlayFrame(video, () => drawOverlays(source.source_uri));
        } catch (error) {
          status.textContent = `پیش‌نمایش در دسترس نیست: ${error.message}`;
          status.classList.remove("hidden");
          await closePreview(source.source_uri);
          schedulePreviewRetry(source.source_uri);
        }
      }

      function connectResultSocket() {
        if (!broadcasting || !previewAvailable) return;
        if (resultSocket && [WebSocket.CONNECTING, WebSocket.OPEN].includes(resultSocket.readyState)) return;
        const scheme = window.location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(`${scheme}://${window.location.host}/api/v1/results/ws`);
        resultSocket = socket;
        socket.addEventListener("message", (event) => {
          if (resultSocket !== socket) return;
          const result = JSON.parse(event.data);
          if (!result.task || !result.source_id) return;
          const state = previewStates.get(result.source_id);
          if (!state) return;
          const taskResults = state.taskResults;
          result.receivedAt = Date.now();
          taskResults.set(result.task, result);
        });
        socket.addEventListener("close", () => {
          if (resultSocket !== socket) return;
          resultSocket = null;
          if (broadcasting && previewAvailable) window.setTimeout(connectResultSocket, 1000);
        });
      }

      function disconnectResultSocket() {
        if (!resultSocket) return;
        const socket = resultSocket;
        resultSocket = null;
        socket.close(1000, "پیش‌نمایش غیرفعال شد");
      }

      function connectBroadcastSocket() {
        if (!broadcasting) return;
        if (broadcastSocket && [WebSocket.CONNECTING, WebSocket.OPEN].includes(broadcastSocket.readyState)) return;
        const scheme = window.location.protocol === "https:" ? "wss" : "ws";
        const parameters = new URLSearchParams();
        parameters.set("wall", "true");
        if (sourceOnlyWall) parameters.set("batch", "true");
        if (!useJpegFallback) {
          parameters.set("metadata_only", "true");
        }
        if (fullscreenSourceId) parameters.set("fullscreen_source", fullscreenSourceId);
         const endpoint = sourceOnlyWall ? "/api/v1/video-wall/ws" : "/api/v1/broadcast/ws";
         const socket = new WebSocket(`${scheme}://${window.location.host}${endpoint}?${parameters}`);
        broadcastSocket = socket;
        socket.binaryType = "arraybuffer";
        socket.addEventListener("message", (event) => {
          if (broadcastSocket !== socket) return;
          try {
            if (event.data instanceof ArrayBuffer) {
              // Binary frame: 4-byte header length + JSON header + JPEG bytes
              const view = new DataView(event.data);
              if (view.byteLength < 5) return;
              const headerLength = view.getUint32(0, false);
              if (headerLength <= 0 || headerLength + 4 >= view.byteLength) return;
              const headerBytes = new Uint8Array(event.data, 4, headerLength);
              const header = JSON.parse(new TextDecoder().decode(headerBytes));
              if (header.type === "source_frame_batch") {
                let offset = 4 + headerLength;
                for (let index = 0; index < header.count; index += 1) {
                  if (offset + 4 > view.byteLength) break;
                  const recordLength = view.getUint32(offset, false);
                  offset += 4;
                  if (recordLength <= 0 || offset + recordLength > view.byteLength) break;
                  socket.dispatchEvent(new MessageEvent("source-frame-record", {
                    data: event.data.slice(offset, offset + recordLength),
                  }));
                  offset += recordLength;
                }
                return;
              }
              if (!header.source_id) return;

              // Update frame stats
              const stats = statsFor(header.source_id);
              const incomingFrameIndex = Number.isFinite(header.frame_index) ? header.frame_index : null;
              if (
                incomingFrameIndex !== null
                && stats.frameIndex !== null
                && incomingFrameIndex < stats.frameIndex
              ) return;
              const isNewSourceFrame = (
                incomingFrameIndex === null
                || stats.frameIndex === null
                || incomingFrameIndex > stats.frameIndex
              );
              if (isNewSourceFrame) {
                const now = performance.now();
                stats.arrivals.push(now);
                stats.total += 1;
                stats.lastArrival = now;
                sessionReceivedFrames += 1;
              }
              if (incomingFrameIndex !== null) stats.frameIndex = incomingFrameIndex;

              // Update resolution badge
              const elements = metricElements.get(header.source_id);
              if (elements && Number.isFinite(header.frame_width) && Number.isFinite(header.frame_height)) {
                elements.resolution.textContent = `${header.render_profile === "full" ? "کامل" : header.render_profile === "wall" ? "دیوار" : "حاشیه‌نویسی‌شده"} · ${header.frame_width}×${header.frame_height}`;
              }

              // Display JPEG on fallback img element
              if (useJpegFallback) {
                const jpegBytes = new Uint8Array(event.data, 4 + headerLength);
                const blob = new Blob([jpegBytes], { type: "image/jpeg" });
                const url = URL.createObjectURL(blob);
                const selector = sourceSelector(header.source_id);
                const img = document.querySelector(`img[data-jpeg-for="${selector}"]`);
                if (img) {
                  const prev = jpegBlobUrls.get(header.source_id);
                  jpegBlobUrls.set(header.source_id, { url });
                  img.addEventListener("load", () => {
                    if (prev && prev.url !== url) URL.revokeObjectURL(prev.url);
                  }, { once: true });
                  img.addEventListener("error", () => {
                    if (prev && prev.url !== url) URL.revokeObjectURL(prev.url);
                    if (jpegBlobUrls.get(header.source_id)?.url === url) {
                      jpegBlobUrls.delete(header.source_id);
                    }
                    URL.revokeObjectURL(url);
                  }, { once: true });
                  img.src = url;
                  // Hide status overlay when first frame arrives
                  const status = document.querySelector(`[data-status-for="${selector}"]`);
                  if (status) status.classList.add("hidden");
                }
              }
              return;
            }

            // JSON message
            const message = JSON.parse(event.data);
            if (message.type === "frame_metadata") {
              const stats = statsFor(message.source_id);
              const now = performance.now();
              stats.arrivals.push(now);
              stats.total += 1;
              stats.lastArrival = now;
              stats.frameIndex = message.frame_index;
              sessionReceivedFrames += 1;
            }
            if (message.type === "camera_changed") synchronizeDashboard();
            if (message.type === "recent_detections") {
              renderRecentDetections(message);
            }
          } catch (_) {
            // Ignore keepalives or extensions unknown to this dashboard version.
          }
        });
        socket.addEventListener("source-frame-record", (event) => {
          if (broadcastSocket !== socket) return;
          socket.dispatchEvent(new MessageEvent("message", { data: event.data }));
        });
        socket.addEventListener("close", () => {
          if (broadcastSocket !== socket) return;
          broadcastSocket = null;
          if (broadcasting) {
            clearTimeout(reconnectTimer);
            reconnectTimer = window.setTimeout(connectBroadcastSocket, 1000);
          }
        });
      }

      function disconnectBroadcastSocket() {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
        if (broadcastSocket) {
          const socket = broadcastSocket;
          broadcastSocket = null;
          socket.close(1000, "پخش غیرفعال شد");
        }
      }

      function reconnectBroadcastSocket() {
        if (!broadcasting) return;
        disconnectBroadcastSocket();
        for (const stats of frameStats.values()) {
          stats.arrivals = [];
          stats.lastArrival = 0;
          stats.frameIndex = null;
        }
        connectBroadcastSocket();
      }

      function applyStreams() {
        for (const video of document.querySelectorAll("video[data-source-id]")) {
          const sourceId = video.dataset.sourceId;
          const source = sources.find((item) => item.source_uri === sourceId);
          const selector = sourceSelector(sourceId);
          const status = document.querySelector(`[data-status-for="${selector}"]`);
          const img = document.querySelector(`img[data-jpeg-for="${selector}"]`);
          if (!source?.enabled) {
            closePreview(sourceId);
            video.style.display = "none";
            if (img) img.style.display = "none";
            status.textContent = "منبع در مدیریت وظایف غیرفعال است";
            status.classList.remove("hidden");
            continue;
          }
          if (!broadcasting) {
            // Broadcast disabled
            closePreview(sourceId);
            video.style.display = "";
            if (img) img.style.display = "none";
            status.textContent = "پخش برای رابط کاربری غیرفعال است";
            status.classList.remove("hidden");
            continue;
          }
          // JPEG fallback is the primary display - annotated frames from broadcast hub
          if (img) img.style.display = "block";
          status.textContent = "در انتظار فریم‌های منبع…";
          status.classList.remove("hidden");
          // JPEG and WebRTC are alternative wall transports. Do not decode
          // both for every tile while the JPEG wall covers the video element.
          if (previewAvailable && !useJpegFallback) {
            video.style.display = "";
            if (source) openPreview(source);
          } else {
            closePreview(sourceId);
            video.style.display = "none";
          }
        }
        if (broadcasting) {
          connectBroadcastSocket();
          if (useJpegFallback) disconnectResultSocket();
          else connectResultSocket();
        } else {
          disconnectBroadcastSocket();
          disconnectResultSocket();
        }
      }

      function showState(enabled) {
        const changed = broadcasting !== enabled;
        broadcasting = enabled;
        stateElement.classList.toggle("live", enabled);
        stateElement.querySelector("span:last-child").textContent = enabled ? "پخش زنده است" : "پخش متوقف است";
        toggleButton.disabled = false;
        toggleButton.textContent = enabled ? "توقف پخش رابط کاربری" : "شروع پخش رابط کاربری";
        toggleButton.classList.toggle("stop", enabled);
        if (changed) applyStreams();
      }

      function updateStreamModeButton() {
        streamModeButton.textContent = sourceOnlyWall ? "جریان هوش مصنوعی" : "دیوار فقط منبع";
        streamModeButton.title = sourceOnlyWall
          ? "تغییر به پخش پردازش‌شده با هوش مصنوعی"
          : "تغییر به دیوار ویدیویی فقط منبع";
      }

      function signatureFor(items) {
        return JSON.stringify(
          items.map((source) => ({
            source_uri: source.source_uri,
            name: source.name,
            enabled: source.enabled,
            tasks: [...source.tasks].sort(),
            frame_width: source.frame_width,
            frame_height: source.frame_height,
            preview_path: source.preview_path,
          })),
        );
      }

      async function synchronizeDashboard() {
        if (synchronizationRunning) return;
        synchronizationRunning = true;
        try {
          const [sourcesResponse, stateResponse, liveSourcesResponse] = await Promise.all([fetch("/api/v1/sources/preview-config", { cache: "no-store" }), fetch("/api/v1/broadcast/state", { cache: "no-store" }), fetch("/api/v1/broadcast-gpu/sources", { cache: "no-store" })]);
          if (!sourcesResponse.ok || !stateResponse.ok || !liveSourcesResponse.ok) throw new Error("API در دسترس نیست");
          const previewConfig = await sourcesResponse.json();
          previewBaseUrl = previewConfig.whep_base_url;
          previewAvailable = previewConfig.enabled;
          // JPEG fallback shows server-annotated frames directly from the broadcast hub.
          // WebRTC (preview) is tried as a higher-quality overlay when available.
          // The broadcast hub renders annotated frames for ALL enabled cameras.
          useJpegFallback = true;
          const nextSources = previewConfig.sources;
          const state = await stateResponse.json();
          const liveSourcesConfig = await liveSourcesResponse.json();
          liveBranchSources = Array.isArray(liveSourcesConfig.sources) ? liveSourcesConfig.sources : [];
          showState(state.enabled);
          const nextSignature = signatureFor(nextSources);
          if (nextSignature !== sourcesSignature) {
            sources = nextSources;
            sourcesSignature = nextSignature;
            renderSources();
          }
          syncStatus.textContent = `API همگام شد · ${new Date().toLocaleTimeString("fa-IR")} · ${useJpegFallback ? "نمای جایگزین JPEG" : "WebRTC"}`;
        } catch (error) {
          stateElement.querySelector("span:last-child").textContent = "API در دسترس نیست";
          syncStatus.textContent = `همگام‌سازی با خطا مواجه شد: ${error.message}`;
        } finally {
          synchronizationRunning = false;
        }
      }

      toggleButton.addEventListener("click", async () => {
        toggleButton.disabled = true;
        try {
          const response = await fetch("/api/v1/broadcast/state", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ enabled: !broadcasting }),
          });
          if (!response.ok) throw new Error("تغییر وضعیت پخش امکان‌پذیر نیست");
          const state = await response.json();
          showState(state.enabled);
        } catch (error) {
          toggleButton.disabled = false;
          stateElement.querySelector("span:last-child").textContent = error.message;
        }
      });

      wallFullscreenButton.addEventListener("click", async () => {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.documentElement.requestFullscreen();
        }
      });

      streamModeButton.addEventListener("click", () => {
        sourceOnlyWall = !sourceOnlyWall;
        updateStreamModeButton();
        reconnectBroadcastSocket();
      });

      liveBranchButton.addEventListener("click", () => setLiveBranchView(!liveBranchView));
      liveBranchBack.addEventListener("click", () => setLiveBranchView(false));

      document.addEventListener("fullscreenchange", () => {
        const fullscreenElement = document.fullscreenElement;
        const nextFullscreenSourceId = fullscreenElement?.classList.contains("camera-card") ? fullscreenElement.dataset.sourceId : null;
        if (nextFullscreenSourceId !== fullscreenSourceId) {
          fullscreenSourceId = nextFullscreenSourceId;
          reconnectBroadcastSocket();
        }
        wallFullscreenButton.textContent = fullscreenElement === document.documentElement ? "خروج از تمام‌صفحه" : "نمایش تمام‌صفحه دیوار";
        for (const button of document.querySelectorAll("[data-fullscreen-source]")) {
          button.textContent = fullscreenElement === button.closest(".camera-card") ? "خروج از تمام‌صفحه" : "تمام‌صفحه";
        }
        if (!document.fullscreenElement && liveBranchFullscreen) {
          const state = liveBranchFullscreen;
          liveBranchFullscreen = null;
          releaseLiveBranch(state);
          const source = sources.find((item) => item.source_uri === state.sourceUri);
          const card = state.card;
          if (source && liveBranchView) acquireLiveBranch(source, "wall", state.video, card);
        }
      });

      window.addEventListener("beforeunload", () => {
        for (const sourceId of previewStates.keys()) closePreview(sourceId);
        clearJpegBlobs();
        disconnectBroadcastSocket();
        disconnectResultSocket();
        closeLiveBranchView();
      });

      if (location.hash === "#live-branch") setLiveBranchView(true);

      synchronizeDashboard();
      updateStreamModeButton();
      window.setInterval(synchronizeDashboard, 2000);
      window.setInterval(updateFrameMetrics, 500);
    </script>
  </body>
</html>
