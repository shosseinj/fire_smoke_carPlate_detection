<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video AI Operations Wall</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070a11;
      --panel: #101621;
      --panel-2: #151d2b;
      --line: #263246;
      --text: #f5f7fb;
      --muted: #91a0b7;
      --cyan: #27d3ff;
      --green: #38dc86;
      --orange: #ffad42;
      --red: #ff5263;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% -10%, rgba(39, 211, 255, .12), transparent 32rem),
        radial-gradient(circle at 95% 0%, rgba(56, 220, 134, .08), transparent 28rem),
        var(--bg);
      color: var(--text);
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 18px 24px;
      border-bottom: 1px solid rgba(145, 160, 183, .18);
      background: rgba(7, 10, 17, .88);
      backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(39, 211, 255, .45);
      border-radius: 12px;
      background: rgba(39, 211, 255, .1);
      color: var(--cyan);
      font-weight: 900;
      letter-spacing: -.05em;
    }
    h1 { margin: 0; font-size: 18px; letter-spacing: .01em; }
    .subtitle { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .controls { display: flex; align-items: center; gap: 12px; }
    .docs-link {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 12px;
      color: #b9c7db;
      text-decoration: none;
      font-size: 12px;
      font-weight: 750;
      transition: .18s ease;
    }
    .docs-link:hover { border-color: var(--cyan); color: var(--text); }
    .state {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .state-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 4px rgba(255, 82, 99, .12);
    }
    .state.live .state-dot {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(56, 220, 134, .12), 0 0 16px rgba(56, 220, 134, .55);
    }
    button {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-weight: 750;
      transition: .18s ease;
    }
    button:hover { border-color: var(--cyan); transform: translateY(-1px); }
    button.stop { border-color: rgba(255, 82, 99, .4); color: #ff9aa5; }
    main { padding: 22px 24px 36px; }
    .summary {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 12px;
    }
    .camera-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }
    .camera-card {
      overflow: hidden;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(21, 29, 43, .96), rgba(11, 15, 24, .98));
      box-shadow: 0 18px 40px rgba(0, 0, 0, .22);
    }
    .stream-shell {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #03050a;
    }
    .stream-shell img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .stream-status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: repeating-linear-gradient(-45deg, #0a0e16, #0a0e16 8px, #0d121c 8px, #0d121c 16px);
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      letter-spacing: .04em;
    }
    .stream-status.hidden { display: none; }
    .card-info { padding: 12px 13px 13px; }
    .camera-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .camera-name { overflow: hidden; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .camera-id { color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .task-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .task-chip {
      border: 1px solid rgba(39, 211, 255, .28);
      border-radius: 999px;
      padding: 4px 8px;
      background: rgba(39, 211, 255, .08);
      color: #8eeaff;
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .task-chip.fire { border-color: rgba(255, 173, 66, .35); background: rgba(255, 173, 66, .09); color: #ffc779; }
    .offline { opacity: .55; }
    @media (max-width: 1250px) { .camera-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 700px) {
      header { align-items: flex-start; padding: 15px; }
      .subtitle { display: none; }
      .controls { align-items: flex-end; flex-direction: column; }
      main { padding: 16px 14px 28px; }
      .camera-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark">AI</div>
      <div>
        <h1>Video AI Operations Wall</h1>
        <div class="subtitle">Server-rendered fire, smoke, and plate annotations</div>
      </div>
    </div>
    <div class="controls">
      <div class="state" id="broadcastState"><span class="state-dot"></span><span>Connecting</span></div>
      <a class="docs-link" href="/docs" target="_blank" rel="noopener">API / Swagger</a>
      <button id="toggleButton" type="button" disabled>Loading…</button>
    </div>
  </header>
  <main>
    <div class="summary">
      <span id="cameraCount">Loading cameras…</span>
      <span id="syncStatus">Synchronizing with API…</span>
    </div>
    <section class="camera-grid" id="cameraGrid" aria-live="polite"></section>
  </main>
  <script>
    const stateElement = document.getElementById('broadcastState');
    const toggleButton = document.getElementById('toggleButton');
    const cameraGrid = document.getElementById('cameraGrid');
    const cameraCount = document.getElementById('cameraCount');
    const syncStatus = document.getElementById('syncStatus');
    let sources = [];
    let broadcasting = false;
    let sourcesSignature = '';
    let synchronizationRunning = false;

    const taskLabel = task => task === 'fire_smoke' ? 'Fire / Smoke' : 'Plate Recognition';

    function renderSources() {
      cameraGrid.innerHTML = '';
      for (const source of sources) {
        const card = document.createElement('article');
        card.className = `camera-card${source.enabled ? '' : ' offline'}`;
        const chips = source.tasks.map(task =>
          `<span class="task-chip ${task === 'fire_smoke' ? 'fire' : ''}">${taskLabel(task)}</span>`
        ).join('');
        card.innerHTML = `
          <div class="stream-shell">
            <img alt="Annotated stream for ${source.name}" data-source-id="${source.source_id}">
            <div class="stream-status" data-status-for="${source.source_id}">Waiting for processed frames…</div>
          </div>
          <div class="card-info">
            <div class="camera-row">
              <span class="camera-name">${source.name}</span>
              <span class="camera-id">${source.source_id}</span>
            </div>
            <div class="task-list">${chips}</div>
          </div>`;
        const image = card.querySelector('img');
        const status = card.querySelector('.stream-status');
        image.addEventListener('load', () => status.classList.add('hidden'));
        image.addEventListener('error', () => {
          status.textContent = broadcasting ? 'Waiting for AI output…' : 'Frontend broadcast disabled';
          status.classList.remove('hidden');
        });
        cameraGrid.appendChild(card);
      }
      cameraCount.textContent = `${sources.filter(source => source.enabled).length} active cameras · ${sources.length} configured`;
      applyStreams();
    }

    function applyStreams() {
      for (const image of document.querySelectorAll('img[data-source-id]')) {
        const sourceId = image.dataset.sourceId;
        const status = document.querySelector(`[data-status-for="${sourceId}"]`);
        if (broadcasting) {
          status.textContent = 'Waiting for processed frames…';
          status.classList.remove('hidden');
          image.src = `/api/v1/broadcast/streams/${encodeURIComponent(sourceId)}.mjpg?t=${Date.now()}`;
        } else {
          image.removeAttribute('src');
          status.textContent = 'Frontend broadcast disabled';
          status.classList.remove('hidden');
        }
      }
    }

    function showState(enabled) {
      const changed = broadcasting !== enabled;
      broadcasting = enabled;
      stateElement.classList.toggle('live', enabled);
      stateElement.querySelector('span:last-child').textContent = enabled ? 'Broadcast live' : 'Broadcast stopped';
      toggleButton.disabled = false;
      toggleButton.textContent = enabled ? 'Stop frontend broadcast' : 'Start frontend broadcast';
      toggleButton.classList.toggle('stop', enabled);
      if (changed) applyStreams();
    }

    function signatureFor(items) {
      return JSON.stringify(items.map(source => ({
        source_id: source.source_id,
        name: source.name,
        enabled: source.enabled,
        tasks: [...source.tasks].sort(),
        source_uri: source.source_uri
      })));
    }

    async function synchronizeDashboard() {
      if (synchronizationRunning) return;
      synchronizationRunning = true;
      try {
        const [sourcesResponse, stateResponse] = await Promise.all([
          fetch('/api/v1/sources', {cache: 'no-store'}),
          fetch('/api/v1/broadcast/state', {cache: 'no-store'})
        ]);
        if (!sourcesResponse.ok || !stateResponse.ok) throw new Error('API unavailable');
        const nextSources = await sourcesResponse.json();
        const state = await stateResponse.json();
        showState(state.enabled);
        const nextSignature = signatureFor(nextSources);
        if (nextSignature !== sourcesSignature) {
          sources = nextSources;
          sourcesSignature = nextSignature;
          renderSources();
        }
        syncStatus.textContent = `API synchronized · ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        stateElement.querySelector('span:last-child').textContent = 'API unavailable';
        syncStatus.textContent = `Synchronization failed: ${error.message}`;
      } finally {
        synchronizationRunning = false;
      }
    }

    toggleButton.addEventListener('click', async () => {
      toggleButton.disabled = true;
      try {
        const response = await fetch('/api/v1/broadcast/state', {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({enabled: !broadcasting})
        });
        if (!response.ok) throw new Error('Could not change broadcast state');
        const state = await response.json();
        showState(state.enabled);
      } catch (error) {
        toggleButton.disabled = false;
        stateElement.querySelector('span:last-child').textContent = error.message;
      }
    });

    synchronizeDashboard();
    window.setInterval(synchronizeDashboard, 2000);
  </script>
</body>
</html>
